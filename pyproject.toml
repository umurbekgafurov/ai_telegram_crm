[tool.poetry]
name = "ai-telegram-crm"
version = "0.1.0"
description = "Telegram-based CRM for the Uzbek SMB market"
authors = ["Your Company <dev@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
aiogram = "^3.13"
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.29"
alembic = "^1.13"
pydantic = "^2.9"
pydantic-settings = "^2.7"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.11"
ruff = "^0.6"
pytest = "^8.3"
pytest-asyncio = "^0.24"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
